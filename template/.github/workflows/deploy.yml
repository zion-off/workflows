name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: zion-off/workflows/.github/workflows/deploy.yml@main
    with:
      node-version: "22"
      build: npm ci && npm run build
      build-output: |
        dist
